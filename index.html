<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --text: #2c2416;
  --muted: #8a7a60;
  --gold: #b38a4b;
  --gold-soft: rgba(179,138,75,0.35);
  --bgA: #fdf9f3;
  --bgB: #f5e8d4;
  --card: #fdf9f4;
  --padX: 16px;
}
body{
  font-family: 'Georgia', 'Times New Roman', serif;
  min-height: 100vh;
  background: radial-gradient(circle at 30% 0%, var(--bgA) 0%, #f9f2e4 45%, var(--bgB) 100%);
  padding: 0;
  overflow-x: hidden;
  color: var(--text);
}
.page-wrapper{
  width: 100%;
  display: flex;
  justify-content: center;
}
/* МОБИЛКА: без рамок/скруглений */
.card{
  width: 100%;
  max-width: none;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
}
.top-section{
  position: relative;
  background: radial-gradient(circle at 30% 0%, var(--bgA) 0%, #f9f2e4 45%, var(--bgB) 100%);
  padding: calc(14px + env(safe-area-inset-top)) var(--padX) 46px;
}
/* Декор 1400×400 */
.top-section::before{
  content:"";
  position:absolute;
  left: 0;
  right: 0;
  top: 0;
  height: clamp(140px, 27vw, 200px);
  background: url("decor-top.png") top center / 100% auto no-repeat;
  pointer-events:none;
  z-index:0;
  opacity: 1;
}
/* Нижняя завершающая полоска */
.top-section::after{
  content:"";
  position:absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 14px;
  background: linear-gradient(to right,
    rgba(179,138,75,0),
    rgba(179,138,75,0.55),
    rgba(179,138,75,0)
  );
  z-index: 0;
}
.content{
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
}
/* Весы + АДВОКАТ */
.logo-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin: 0 0 30px;
}
.scales-img{
  width: 56px;
  height: 56px;
  object-fit: contain;
  margin-bottom: 6px;
}
.advokat-label{
  display:flex;
  align-items:center;
  gap: 10px;
  color: var(--gold);
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 3.4px;
  font-weight: 500;
  white-space: nowrap;
}
.advokat-label::before,
.advokat-label::after{
  content:"";
  display:block;
  width: 36px;
  height: 1px;
  background: var(--gold);
  opacity: .9;
}
.hero-grid{
  display:grid;
  grid-template-columns: minmax(0,1fr) clamp(200px, 48vw, 280px);
  grid-template-areas:
    "head photo"
    "left photo"
    "wide wide";
  column-gap: 14px;
  row-gap: 0;
  align-items: start;
}
.hero-head{
  grid-area: head;
  padding-top: 18px;
}
.name-last{
  font-size: clamp(28px, 6.6vw, 38px);
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text);
}
.name-first{
  font-size: clamp(32px, 7.4vw, 44px);
  font-weight: 500;
  font-style: normal;
  line-height: 1.06;
  margin-top: 14px;
  color: var(--gold);
}
.photo-wrap{
  grid-area: photo;
  justify-self: end;
  align-self: start;
  padding-top: 0;
  margin-right: calc(-1 * var(--padX));
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.photo-wrap img{
  width: 100%;
  height: auto;
  aspect-ratio: 400 / 521;
  display:block;
  background: transparent;
  filter: none;
  border-radius: 0;
  align-self: stretch;
}
.contacts-left{
  grid-area: left;
  display:flex;
  flex-direction:column;
  gap: 12px;
  margin-top: 28px;
  min-width: 0;
}
.contacts-wide{
  grid-area: wide;
  display:flex;
  flex-direction:column;
  gap: 12px;
  margin-top: 16px;
  min-width: 0;
}
.contact-item{
  display:flex;
  align-items:center;
  gap: 12px;
  text-decoration:none;
  color: var(--text);
  transition: opacity .2s;
  min-width: 0;
}
.contact-item:hover{ opacity:.72; }
.contact-icon{
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  flex: 0 0 auto;
}
/* Иконки по умолчанию */
.contact-icon svg{
  width: 22px;
  height: 22px;
  fill:#fff;
}
/* Иконка телеграма — чуть крупнее, без вложенного кружка */
.contact-icon svg.tg-icon{
  width: 26px;
  height: 26px;
}
.contact-text{
  font-family: Arial, sans-serif;
  font-size: 13.6px;
  line-height: 1.35;
  color: #3a2e1e;
  min-width: 0;
  white-space: nowrap;
}
.contact-text small{
  display:block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
/* Телефон: не жирный, без переноса */
.contact-item.phone .contact-text{
  font-size: 14.6px;
  font-weight: 400;
  white-space: nowrap;
}
.contact-item.oneline .contact-text{
  white-space: nowrap;
}
.contact-divider{
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold-soft), transparent);
  margin: 8px 0;
}
/* ====== Сохранить контакт: сразу под фото, 90% от ширины фото, прижата вправо ====== */
.save-under-photo{
  width: 100%;
  margin-top: 0;
  display: flex;
  justify-content: flex-end;
  align-self: stretch;
}
.save-btn{
  display: block;
  width: 90%;
  padding: 10px 12px;
  border-radius: 14px 0 0 14px;
  background: linear-gradient(180deg, #c29a5a 0%, var(--gold) 100%);
  color: #fff;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 14px 30px rgba(44, 36, 22, 0.18);
  text-align: center;
}
.save-btn:hover{ opacity: .9; }
/* save-note скрыт */
.save-note{
  display: none;
}
/* ====== На очень узких ширинах делаем фото+кнопку "декором" справа (absolute) ====== */
@media (max-width: 420px){
  .hero-grid{
    grid-template-columns: 1fr;
    grid-template-areas:
      "head"
      "left"
      "wide";
    position: relative;
    padding-right: clamp(140px, 44vw, 220px);
  }
  .photo-wrap{
    position: absolute;
    right: calc(-1 * var(--padX));
    top: 6px;
    width: clamp(140px, 44vw, 220px);
    margin: 0;
    padding: 0;
    z-index: 2;
    pointer-events: auto;
  }
  .photo-wrap img{
    width: 100%;
    height: auto;
    max-height: 52vh;
    object-fit: contain;
    pointer-events: none;
  }
  .hero-head, .contacts-left, .contacts-wide{
    position: relative;
    z-index: 1;
  }
  .contact-item.oneline .contact-text,
  .contact-item.phone .contact-text{
    white-space: nowrap;
  }
  .contacts-left{ margin-top: 18px; }
}
/* ДЕСКТОП: аккуратная карточка */
@media (min-width: 768px){
  :root{ --padX: 22px; }
  body{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 0%, var(--bgA) 0%, #f9f2e4 45%, var(--bgB) 100%);
  }
  .page-wrapper{
    grid-column: 2;
    align-items:center;
    padding: 48px 0;
  }
  .card{
    width: 540px;
    max-width: 540px;
    background: var(--card);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 72px rgba(0,0,0,0.18);
  }
  .top-section{
    padding: 18px var(--padX) 56px;
  }
  .top-section::before{
    height: 260px;
    background-size: 112% auto;
    background-position: center -8px;
  }
  .hero-grid{
    grid-template-columns: minmax(0,1fr) 300px;
    column-gap: 18px;
    padding-right: 0;
  }
  .photo-wrap{
    position: static;
    width: auto;
    z-index: 1;
    margin-right: calc(-1 * var(--padX));
  }
}
